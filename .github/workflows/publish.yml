name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun test

      # NOTE: do NOT set registry-url here. setup-node's registry-url writes an
      # .npmrc with _authToken=${NODE_AUTH_TOKEN} and a placeholder token, which
      # overrides OIDC trusted publishing and 404s. Default registry is npmjs.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing needs a recent npm (OIDC support, >= 11.5.1).
      - run: npm install -g npm@latest

      # No token / no NODE_AUTH_TOKEN: npm exchanges the OIDC id-token for a
      # short-lived credential (trusted publisher configured on npmjs.com).
      - run: npm publish --access public --provenance
