name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun test

      # NOTE: do NOT set registry-url here. setup-node's registry-url writes an
      # .npmrc with _authToken=${NODE_AUTH_TOKEN} and a placeholder token, which
      # overrides OIDC trusted publishing and 404s. Default registry is npmjs.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing needs npm >= 11.5.1 (node 22 ships npm 10.x). Do the
      # upgrade and publish in ONE shell so `npm publish` uses the upgraded npm
      # (separate steps re-resolved the old bundled npm → ENEEDAUTH). No token:
      # npm exchanges the OIDC id-token for a short-lived publish credential.
      - name: Publish via OIDC trusted publishing
        run: |
          npm install -g npm@latest
          hash -r
          echo "npm version: $(npm --version)"
          npm publish --access public --provenance
